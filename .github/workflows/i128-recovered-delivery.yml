name: Recovered i128 boundary delivery
on:
  push:
    branches: [validation/mova-i128-rivet76f4-20261004]
permissions:
  contents: write
jobs:
  i128:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_PIN: aaf9925a9dcea11d902a2f3936282b3ed7cdbff9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover exact source and two-file change
        run: |
          set -euo pipefail
          cp delivery.patch "$RUNNER_TEMP/delivery.patch"
          git fetch --depth=1 origin "$SOURCE_PIN"
          git checkout --detach "$SOURCE_PIN"
          test "$(git hash-object lib/stellar/scval.ts)" = 839800b25b1a2f4cdc6fc911548787d02a479a52
          test "$(git hash-object tests/lib/stellar/scval.test.ts)" = 57896428c0febe8cd0f14b17727210175e820aec
          git apply "$RUNNER_TEMP/delivery.patch"
          test "$(git hash-object lib/stellar/scval.ts)" = 6aed8abb9655bb82b1e472497d91dda6b547a043
          test "$(git hash-object tests/lib/stellar/scval.test.ts)" = 05f4ac58040c6024617f0df76256ab15f018b40b
          mkdir -p "$RUNNER_TEMP/i128-evidence"
          { git rev-parse HEAD; node --version; npm --version; sha256sum package.json package-lock.json; } | tee "$RUNNER_TEMP/i128-evidence/environment.log"
      - name: Install the unchanged locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --fetch-retries=0 2>&1 | tee "$RUNNER_TEMP/i128-evidence/install.log"
      - name: Format only the changed source and maintained test
        run: |
          ./node_modules/.bin/prettier --write lib/stellar/scval.ts tests/lib/stellar/scval.test.ts
          git diff --exit-code -- package.json package-lock.json
      - name: Run one source-bound before and after selection
        run: |
          set -euo pipefail
          cp lib/stellar/scval.ts "$RUNNER_TEMP/i128-fixed.ts"
          git show "$SOURCE_PIN:lib/stellar/scval.ts" > lib/stellar/scval.ts
          set +e
          ./node_modules/.bin/vitest run tests/lib/stellar/scval.test.ts -t 'rejects .* before constructing XDR' --maxWorkers=2 --reporter=json --outputFile="$RUNNER_TEMP/i128-evidence/before.json" > "$RUNNER_TEMP/i128-evidence/before.log" 2>&1
          code=$?
          set -e
          cp "$RUNNER_TEMP/i128-fixed.ts" lib/stellar/scval.ts
          test "$code" -eq 1
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'i128-evidence'/'before.json'
          r=json.loads(p.read_text())
          assert r['numFailedTests']==6, r
          print('Baseline: six boundary regressions reached execution and failed')
          PY
          ./node_modules/.bin/vitest run tests/lib/stellar/scval.test.ts --maxWorkers=2 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/i128-evidence/after.json" 2>&1 | tee "$RUNNER_TEMP/i128-evidence/after.log"
          git diff --exit-code -- package.json package-lock.json
      - name: Publish only the two checked files on a new source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          repo='woahwhattheheck/mova-store'
          assert os.environ['GITHUB_REPOSITORY']==repo
          pin=os.environ['SOURCE_PIN']
          evidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'i128-evidence'
          result=json.loads((evidence/'after.json').read_text())
          assert result['success'] and result['numFailedTests']==0 and result['numPendingTests']==0
          def api(path, body=None):
              request=urllib.request.Request(f'https://api.github.com/repos/{repo}/'+path, data=None if body is None else json.dumps(body).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'source-publication'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          parent=api('git/commits/'+pin)
          entries=[]
          for name in ['lib/stellar/scval.ts','tests/lib/stellar/scval.test.ts']:
              data=pathlib.Path(name).read_bytes()
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              created=api('git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert created['sha']==blob
              entries.append({'path':name,'mode':'100644','type':'blob','sha':blob})
          tree=api('git/trees',{'base_tree':parent['tree']['sha'],'tree':entries})
          run=f'https://github.com/{repo}/actions/runs/'+os.environ['GITHUB_RUN_ID']
          count=result['numPassedTests']
          message=f'fix(stellar): reject lossy i128 inputs before XDR encoding\n\nReject values outside signed 128-bit bounds and unsafe Number inputs before narrowing them into XDR words. Preserve valid bigint, string and safe-integer encodings. No SDK, dependency, contract or wallet-operation changes.\n\nSource-bound canonical Vitest selection tests/lib/stellar/scval.test.ts: six new boundary cases fail against parent {pin}; all {count} selected tests pass after repair, none pending. Uses the unchanged npm lock and existing Vitest setup; only the two changed files are formatted. Completed execution: {run}\n\nNo full-suite/build/typecheck, testnet transaction, sponsor acceptance or reward claim.'
          commit=api('git/commits',{'message':message,'tree':tree['sha'],'parents':[pin]})
          ref=api('git/refs',{'ref':'refs/heads/fix/stellar-i128-bounds-rivet76f4-20261004','sha':commit['sha']})
          receipt={'source_parent':pin,'commit':commit['sha'],'tree':tree['sha'],'ref':ref['ref'],'files':entries,'passed':count,'run':run}
          (evidence/'publication.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Retain exact execution records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mova-i128-rivet76f4-evidence
          path: ${{ runner.temp }}/i128-evidence/
          retention-days: 7
          if-no-files-found: error
